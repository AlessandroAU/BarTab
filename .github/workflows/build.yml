name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows:
    # build.bat uses the Visual Studio 2022 generator.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build, test and install
        shell: cmd
        run: build.bat Release

      - name: Package
        shell: pwsh
        run: |
          $package = "BarTab-windows-x64"
          New-Item -ItemType Directory $package | Out-Null
          Copy-Item bin\BarTab.exe, bin\licenses $package -Recurse
          Compress-Archive $package "$package.zip"
          # The bare executable is what the app's self-update downloads.
          Copy-Item bin\BarTab.exe "$package.exe"

      - uses: actions/upload-artifact@v5
        with:
          name: BarTab-windows-x64
          path: |
            BarTab-windows-x64.zip
            BarTab-windows-x64.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    # Built against glibc 2.28 so the binary runs on Debian 10, Ubuntu 20.04,
    # RHEL 8 and anything newer. gcc-toolset links the parts of libstdc++ newer
    # than the system's into the executable, so only old system libraries are needed.
    container: almalinux:8
    defaults:
      run:
        shell: bash
    steps:
      # Git must be present before checkout, or submodules are not fetched.
      - name: Install dependencies
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled powertools
          dnf install -y git gcc-toolset-14 cmake ninja-build pkgconf-pkg-config binutils procps-ng \
            libX11-devel libXext-devel libXrandr-devel libXinerama-devel libXcursor-devel libXi-devel \
            mesa-libGL-devel fontconfig-devel glib2-devel \
            xorg-x11-server-Xvfb xorg-x11-xauth xorg-x11-utils mesa-dri-drivers which

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # Also runs the X11 smoke test under Xvfb.
      - name: Build, test and install
        run: |
          source /opt/rh/gcc-toolset-14/enable
          ./build.sh Release

      - name: Check glibc and libstdc++ versions
        run: |
          newest() { objdump -T bin/BarTab | grep -o "$1[0-9.]*" | sort -uV | tail -n 1; }
          glibc=$(newest 'GLIBC_2\.'); glibcxx=$(newest 'GLIBCXX_3\.4\.')
          echo "Needs $glibc and ${glibcxx:-no libstdc++}"
          [ "$(printf '%s\n' "$glibc" GLIBC_2.28 | sort -V | tail -n 1)" = GLIBC_2.28 ] || { echo "Needs a glibc newer than 2.28"; exit 1; }
          [ -z "$glibcxx" ] || [ "$(printf '%s\n' "$glibcxx" GLIBCXX_3.4.25 | sort -V | tail -n 1)" = GLIBCXX_3.4.25 ] \
            || { echo "Needs a libstdc++ newer than GCC 8's"; exit 1; }

      # A tarball keeps the executable bit, which artifact uploads drop.
      - name: Package
        run: |
          package=BarTab-linux-x64
          mkdir "$package"
          cp -r bin/BarTab bin/licenses "$package"
          tar -czf "$package.tar.gz" "$package"
          # The bare executable is what the app's self-update downloads; it
          # restores the executable bit itself.
          cp bin/BarTab "$package.bin"

      - uses: actions/upload-artifact@v5
        with:
          name: BarTab-linux-x64
          path: |
            BarTab-linux-x64.tar.gz
            BarTab-linux-x64.bin
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # The app compares its CMake version with the tag to decide what is newer.
      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^project(BarTab VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match CMake version $version"; exit 1; }

      - uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true

      # Each executable is signed over its name, version and SHA-512, in the
      # format src/core/update.cpp's signed_message() rebuilds before trusting
      # a download. The key must be the one whose public half the app embeds.
      - name: Sign the executables
        working-directory: assets
        env:
          SIGNING_KEY: ${{ secrets.BARTAB_SIGNING_KEY }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "The BARTAB_SIGNING_KEY secret is not set"; exit 1; }
          mv BarTab-linux-x64.bin BarTab-linux-x64
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          openssl pkey -in "$RUNNER_TEMP/key.pem" -pubout -out "$RUNNER_TEMP/public.pem"
          embedded=$(sed -n '/release_key{/,/};/p' ../src/core/update.cpp | grep -o '0x[0-9a-f][0-9a-f]' | sed 's/0x//' | tr -d '\n')
          actual=$(openssl pkey -pubin -in "$RUNNER_TEMP/public.pem" -outform DER | tail -c 32 | od -An -tx1 -v | tr -d ' \n')
          [ "$embedded" = "$actual" ] || { echo "BARTAB_SIGNING_KEY does not match the key in src/core/update.cpp"; exit 1; }
          version=${GITHUB_REF_NAME#v}
          for asset in BarTab-windows-x64.exe BarTab-linux-x64; do
            hash=$(sha512sum "$asset" | cut -d ' ' -f 1)
            printf 'BarTab update v1\nasset=%s\nversion=%s\nsha512=%s\n' "$asset" "$version" "$hash" > "$RUNNER_TEMP/message"
            openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in "$RUNNER_TEMP/message" -out "$asset.sig"
            openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/public.pem" -rawin -in "$RUNNER_TEMP/message" -sigfile "$asset.sig"
          done
          rm -f "$RUNNER_TEMP/key.pem"

      - name: Publish release
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          BarTab-windows-x64.zip BarTab-linux-x64.tar.gz
          BarTab-windows-x64.exe BarTab-windows-x64.exe.sig BarTab-linux-x64 BarTab-linux-x64.sig
